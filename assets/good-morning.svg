      <ellipse cx="-11" cy="6" rx="1.3" ry="1.9"/><ellipse cx="-4" cy="5" rx="1.3" ry="1.9"/><ellipse cx="4" cy="5" rx="1.3" ry="1.9"/><ellipse cx="11" cy="6" rx="1.3" ry="1.9"/>
      <ellipse cx="-6" cy="14" rx="1.2" ry="1.7"/><ellipse cx="6" cy="14" rx="1.2" ry="1.7"/><ellipse cx="0" cy="11" rx="1.2" ry="1.7"/>
