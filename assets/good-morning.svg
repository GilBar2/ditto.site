    <path d="M-6 -12 C-12 -16 -10 -12 -4 -8 Z M6 -12 C12 -16 10 -12 4 -8 Z" fill="#2F9E4A"/>
    <path d="M0 -11 L-9 -20 L-4 -10 L0 -22 L4 -10 L9 -20 Z" fill="#3FB35A"/>
