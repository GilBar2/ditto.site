    <path transform="translate(585 82) scale(0.8)" d="M-12 0 Q-6 -7 0 0 Q6 -7 12 0"/>
    <path transform="translate(605 100) scale(0.7)" d="M-12 0 Q-6 -7 0 0 Q6 -7 12 0"/>
