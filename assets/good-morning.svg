    <g transform="translate(690 48) scale(1.3)" opacity="0.9"><ellipse cx="0" cy="0" rx="40" ry="14"/><circle cx="-14" cy="-8" r="14"/><circle cx="10" cy="-13" r="18"/><circle cx="28" cy="-4" r="11"/></g>
    <g transform="translate(230 215) scale(0.9)" opacity="0.75"><ellipse cx="0" cy="0" rx="40" ry="14"/><circle cx="-14" cy="-8" r="14"/><circle cx="10" cy="-13" r="18"/><circle cx="28" cy="-4" r="11"/></g>
    <g transform="translate(690 222) scale(1)" opacity="0.8"><ellipse cx="0" cy="0" rx="40" ry="14"/><circle cx="-14" cy="-8" r="14"/><circle cx="10" cy="-13" r="18"/><circle cx="28" cy="-4" r="11"/></g>
    <g transform="translate(760 140) scale(0.7)" opacity="0.6"><ellipse cx="0" cy="0" rx="40" ry="14"/><circle cx="-14" cy="-8" r="14"/><circle cx="10" cy="-13" r="18"/><circle cx="28" cy="-4" r="11"/></g>
    <g transform="translate(40 150) scale(0.8)" opacity="0.6"><ellipse cx="0" cy="0" rx="40" ry="14"/><circle cx="-14" cy="-8" r="14"/><circle cx="10" cy="-13" r="18"/><circle cx="28" cy="-4" r="11"/></g>
