<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Claude says: Good morning">
  <title>Claude says: Good morning</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1F4D"/>
      <stop offset="1" stop-color="#8EC5FF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="28" fill="url(#sky)"/>
  <!-- rising sun -->
  <g transform="translate(400 250)">
    <circle r="70" fill="#D97757" opacity="0.18"/>
    <circle r="46" fill="#D97757" opacity="0.35"/>
    <g stroke="#D97757" stroke-width="5" stroke-linecap="round" opacity="0.6">
      <line x1="0" y1="-90" x2="0" y2="-110"/>
      <line x1="64" y1="-64" x2="78" y2="-78"/>
      <line x1="-64" y1="-64" x2="-78" y2="-78"/>
      <line x1="90" y1="0" x2="110" y2="0"/>
      <line x1="-90" y1="0" x2="-110" y2="0"/>
    </g>
  </g>
  <line x1="60" y1="250" x2="740" y2="250" stroke="#E6F1FF" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="4" fill="#C9DCF5">CLAUDE SAYS</text>
  <text x="400" y="165" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#FFFFFF">Good morning</text>
</svg>
